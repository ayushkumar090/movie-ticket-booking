<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movies | MovieBook</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="header glass">
    <a class="logo" href="index.html"><img src="images/logo.svg" alt="logo" />MovieBook</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="movies.html" class="active">Movies</a>
      <a href="cart.html">Cart <span id="cart-count">0</span></a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main class="container">
    <h1>Now Showing</h1>
    <section class="filters">
      <input id="search" type="search" placeholder="Search by title..." />
      <select id="genre-filter"><option value="all">All Genres</option></select>
      <select id="language-filter"><option value="all">All Languages</option></select>
      <select id="rating-filter">
        <option value="all">All Ratings</option>
        <option value="4">4★ and above</option>
        <option value="4.5">4.5★ and above</option>
      </select>
    </section>
    <section id="movies-grid" class="movies-grid"></section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/utils.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/movies.js" defer></script>
</body>
</html>
